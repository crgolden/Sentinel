version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      agent-framework:
        patterns:
          - "Microsoft.Agents.AI*"
          - "A2A*"
          - "Anthropic*"
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"
